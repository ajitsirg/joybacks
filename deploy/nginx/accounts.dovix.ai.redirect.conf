# Redirect old accounts.dovix.ai hostname to joyclubs.in
server {
    listen 80;
    listen [::]:80;
    server_name accounts.dovix.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://joyclubs.in$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name accounts.dovix.ai;

    ssl_certificate     /etc/letsencrypt/live/accounts.dovix.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/accounts.dovix.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://joyclubs.in$request_uri;
}
