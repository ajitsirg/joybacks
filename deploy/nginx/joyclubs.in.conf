# Joy Resort public marketing frontend. Django API/admin/static/media routes stay proxied below.
server {
    listen 80;
    listen [::]:80;
    server_name joyclubs.in www.joyclubs.in;

    client_max_body_size 64m;
    include /opt/joyclub/deploy/nginx/cloudflare-realip.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://joyclubs.in$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.joyclubs.in;

    ssl_certificate     /etc/letsencrypt/live/joyclubs.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/joyclubs.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://joyclubs.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name joyclubs.in;

    ssl_certificate     /etc/letsencrypt/live/joyclubs.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/joyclubs.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64m;
    include /opt/joyclub/deploy/nginx/cloudflare-realip.conf;

    location = /robots.txt {
        alias /opt/joyclub/public/robots.txt;
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /sitemap.xml {
        alias /opt/joyclub/public/sitemap.xml;
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
    }

    # Django services: intentionally preserved.
    location /api/ {
        proxy_pass http://127.0.0.1:18001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:18001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:18001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:18001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /downloads/ {
        alias /opt/joyclub/public/downloads/;
        types {
            application/pdf pdf;
            application/json json;
            application/vnd.android.package-archive apk;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=3600";
    }

    # Isolated marketing-site media; deliberately separate from Django /media/.
    location /resort-media/ {
        alias /opt/joyclub/joy-resort-frontend/media/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /assets/ {
        alias /opt/joyclub/joy-resort-frontend/assets/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Preserve legacy shared join URLs after moving the portal under /account/.
    location = /join {
        return 302 /account/register$is_args$args;
    }

    location = /register {
        return 302 /account/register$is_args$args;
    }

    # Authenticated associate and staff portal.
    location ^~ /account/assets/ {
        rewrite ^/account/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:18002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /account/logo-full.png {
        proxy_pass http://127.0.0.1:18002/logo-full.png;
    }

    location = /account/logo-mark.png {
        proxy_pass http://127.0.0.1:18002/logo-mark.png;
    }

    location = /account/logo.png {
        proxy_pass http://127.0.0.1:18002/logo.png;
    }

    location = /account/favicon.png {
        proxy_pass http://127.0.0.1:18002/favicon.png;
    }

    location = /account/favicon.ico {
        proxy_pass http://127.0.0.1:18002/favicon.ico;
    }

    location ^~ /account/ {
        proxy_pass http://127.0.0.1:18002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # TanStack portal assets use an absolute build path.
    location ^~ /_build/ {
        proxy_pass http://127.0.0.1:18002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /opt/joyclub/joy-resort-frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }
}