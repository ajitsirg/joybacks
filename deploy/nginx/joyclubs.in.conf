# Host nginx site for JoyClub Associate at joyclubs.in
# Uses localhost ports so this can coexist with accounts.dovix.ai upstreams.

server {
    listen 80;
    listen [::]:80;
    server_name joyclubs.in www.joyclubs.in;

    client_max_body_size 64m;

    include /opt/joyclub/deploy/nginx/cloudflare-realip.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://joyclubs.in$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.joyclubs.in;

    ssl_certificate     /etc/letsencrypt/live/joyclubs.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/joyclubs.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://joyclubs.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name joyclubs.in;

    ssl_certificate     /etc/letsencrypt/live/joyclubs.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/joyclubs.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64m;

    include /opt/joyclub/deploy/nginx/cloudflare-realip.conf;

    # Real files (not the SPA 404) so Google and Chrome can discover the site
    location = /robots.txt {
        alias /opt/joyclub/public/robots.txt;
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /sitemap.xml {
        alias /opt/joyclub/public/sitemap.xml;
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:18001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:18001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:18001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve APK/PDF from host path (avoids Nitro build-time asset manifest)
    location /downloads/ {
        alias /opt/joyclub/public/downloads/;
        types {
            application/pdf pdf;
            application/json json;
            application/vnd.android.package-archive apk;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=3600";
    }

    # Hashed Vite assets — safe to cache
    location /assets/ {
        proxy_pass http://127.0.0.1:18002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:18002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        # App HTML must not be cached so clients pick up new JS after deploy
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }
}
