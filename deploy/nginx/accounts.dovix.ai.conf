# Host nginx site for JoyClub Associate at accounts.dovix.ai
# Proxies to Docker-published localhost ports.

upstream joyclub_web {
    server 127.0.0.1:18002;
}

upstream joyclub_api {
    server 127.0.0.1:18001;
}

server {
    listen 80;
    listen [::]:80;
    server_name accounts.dovix.ai;

    client_max_body_size 64m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name accounts.dovix.ai;

    # certbot will manage these paths after first issue
    ssl_certificate     /etc/letsencrypt/live/accounts.dovix.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/accounts.dovix.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64m;

    # Django admin / API / media / static / APK downloads via API
    location /api/ {
        proxy_pass http://joyclub_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://joyclub_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://joyclub_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://joyclub_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve APK/PDF from host path (avoids Nitro build-time asset manifest)
    location /downloads/ {
        alias /opt/joyclub/public/downloads/;
        types {
            application/pdf pdf;
            application/json json;
            application/vnd.android.package-archive apk;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        proxy_pass http://joyclub_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
